<!doctype html>
<!-- Brand cards rendered to PNG by render-cards.sh (headless Edge/Chrome).
     ?kind=og | banner | lockup-dark | lockup-light -->
<html lang="en-GB">
<meta charset="utf-8" />
<style>
  @font-face { font-family: Archivo; src: url(../../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: Plex; src: url(../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2); }
  @font-face { font-family: Inter; src: url(../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { --fg: #f2f0ee; --bg: #050606; --dim: #cdcad3; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; position: relative; }
  body.light { --fg: #15171a; --bg: #f1eee7; --dim: #33373d; }
  .bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .scrim { position: absolute; inset: 0; }
  .name { font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 120%; text-transform: uppercase; letter-spacing: -0.03em; line-height: 0.92; }
  .alias { font-family: Plex, monospace; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
  .mark { color: var(--fg); display: block; }
  .row { display: flex; align-items: center; }
  /* --- social card 1200 × 630 --- */
  .og .bg { background-image: url(../render/hero_teardown/0150.png); background-position: 70% 50%; }
  .og .scrim { background: linear-gradient(90deg, rgb(5 6 6 / .94) 0%, rgb(5 6 6 / .7) 42%, rgb(5 6 6 / 0) 78%), linear-gradient(0deg, rgb(5 6 6 / .7), transparent 45%); }
  .og .inner { position: absolute; inset: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .og .name { font-size: 104px; }
  .og .line { margin-top: 26px; font-size: 30px; line-height: 1.35; max-width: 20em; color: #e6e3ea; }
  .og .alias { font-size: 20px; }
  .og .row { gap: 22px; }
  /* --- banner 1500 × 500 --- */
  .banner .bg { background-image: url(../render/hero_teardown/0012.png); background-position: 50% 46%; }
  .banner .scrim { background: linear-gradient(90deg, rgb(5 6 6 / .9) 0%, rgb(5 6 6 / .5) 30%, rgb(5 6 6 / 0) 55%), linear-gradient(0deg, rgb(5 6 6 / .6), transparent 50%); }
  .banner .inner { position: absolute; left: 72px; bottom: 60px; }
  .banner .name { font-size: 76px; margin-top: 22px; }
  .banner .alias { font-size: 18px; margin-top: 16px; }
  /* --- lockups 1600 × 520, transparent-looking flat ground --- */
  .lockup { display: flex; align-items: center; justify-content: center; }
  .lockup .row { gap: 48px; }
  .lockup .name { font-size: 132px; }
  .lockup .alias { font-size: 30px; margin-top: 18px; }
</style>
<body>
<script>
  const kind = new URLSearchParams(location.search).get('kind') || 'og';
  const mark = (s) => `<svg class="mark" width="${s}" height="${s}" viewBox="0 0 64 64"><defs><mask id="m"><circle cx="32" cy="32" r="28" fill="#fff"/><g transform="rotate(-18 32 32)" fill="#000"><rect x="20.5" y="22" width="6.5" height="50"/><rect x="37" y="-8" width="6.5" height="50"/></g></mask></defs><rect width="64" height="64" fill="currentColor" mask="url(#m)"/></svg>`;
  const b = document.body;
  if (kind === 'og') {
    b.className = 'og';
    b.innerHTML = `<div class="bg"></div><div class="scrim"></div><div class="inner">
      <div class="row">${mark(64)}<span class="alias">Oscar Senior &nbsp;·&nbsp; a.k.a. Nops</span></div>
      <div><div class="name">Oscar<br>Senior</div><p class="line">Security engineering and software. I take systems apart to see how they work.</p></div></div>`;
  } else if (kind === 'banner') {
    b.className = 'banner';
    b.innerHTML = `<div class="bg"></div><div class="scrim"></div><div class="inner">${mark(72)}<div class="name">Oscar Senior</div><div class="alias">a.k.a. Nops &nbsp;·&nbsp; security engineering &amp; software</div></div>`;
  } else {
    b.className = 'lockup' + (kind === 'lockup-light' ? ' light' : '');
    b.innerHTML = `<div class="row">${mark(240)}<div><div class="name">Oscar<br>Senior</div><div class="alias">a.k.a. Nops</div></div></div>`;
  }
</script>
</body>
</html>
